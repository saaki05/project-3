[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papermind-platform"
version = "0.1.0"
description = "HTTP search service over a scientific abstract corpus: ranked documents with best-matching evidence sentences."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "papermind-retrieval>=0.1,<0.2",
    "papermind-ingestion>=0.1,<0.2",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
papermind-serve = "papermind_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
