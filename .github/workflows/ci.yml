name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install packages in dependency order
        run: |
          pip install -e "papermind-ingestion[dev]"
          pip install -e "papermind-retrieval[dev]"
          pip install -e "papermind-platform[dev]"
      - run: ruff check .
      - run: pytest -q papermind-ingestion
      - run: pytest -q papermind-retrieval
      - run: pytest -q papermind-platform
